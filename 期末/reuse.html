<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>袋子的下一段旅程｜市場袋探險</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body id="reuse-page">
    <main class="reuse-page">
      <section class="reuse-panel" aria-labelledby="reuse-title">
        <div class="reuse-warning" role="alert">
          <span class="warning-mark">!</span>
          <span>注意：別讓袋子只走一次就結束</span>
        </div>

        <p class="reuse-kicker">四個市場袋收集完成</p>

        <h1 id="reuse-title">袋子不只是一個袋子</h1>

        <p class="reuse-lead">
          它可以裝菜、裝水果，也可以陪你走更多趟市場。<br />
          繼續使用，比丟掉更有價值。
        </p>

        <div class="reuse-steps">
          <div class="reuse-step">
            <span>01</span>
            <h2>清潔</h2>
            <p>用完後擦乾淨，避免殘留污漬與異味。</p>
          </div>

          <div class="reuse-step">
            <span>02</span>
            <h2>晾乾</h2>
            <p>保持乾燥，才能安全地再次使用。</p>
          </div>

          <div class="reuse-step">
            <span>03</span>
            <h2>重複使用</h2>
            <p>下次買菜、買水果時，把袋子帶回市場。</p>
          </div>
        </div>

        <button id="resetReuseBtn" type="button">回到首頁重新探險</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
