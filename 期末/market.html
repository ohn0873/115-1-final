<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>市場袋探險｜市場</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="market-header">
      <h1>市場袋探險</h1>

      <p>尋找市場裡隱藏的袋子</p>

      <div class="count">
        已收集：
        <span id="count">0</span>
        / 4
      </div>
    </header>

    <main class="market-map">
      <!-- 蔬菜攤 -->

      <div
        class="stall-point vegetable"
        id="vegetable"
        role="button"
        tabindex="0"
        onclick="goBag('vegetable')"
        onkeydown="
          if (event.key === 'Enter' || event.key === ' ') goBag('vegetable');
        "
      >
        <div class="icon">🥬</div>

        <h2>蔬菜攤</h2>

        <p>探索</p>
      </div>

      <!-- 魚攤 -->

      <div
        class="stall-point fish"
        id="fish"
        role="button"
        tabindex="0"
        onclick="goBag('fish')"
        onkeydown="
          if (event.key === 'Enter' || event.key === ' ') goBag('fish');
        "
      >
        <div class="icon">🐟</div>

        <h2>魚攤</h2>

        <p>探索</p>
      </div>

      <!-- 豬肉攤 -->

      <div
        class="stall-point pork"
        id="pork"
        role="button"
        tabindex="0"
        onclick="goBag('pork')"
        onkeydown="
          if (event.key === 'Enter' || event.key === ' ') goBag('pork');
        "
      >
        <div class="icon">🐷</div>

        <h2>豬肉攤</h2>

        <p>探索</p>
      </div>

      <!-- 水果攤 -->

      <div
        class="stall-point fruit"
        id="fruit"
        role="button"
        tabindex="0"
        onclick="goBag('fruit')"
        onkeydown="
          if (event.key === 'Enter' || event.key === ' ') goBag('fruit');
        "
      >
        <div class="icon">🍎</div>

        <h2>水果攤</h2>

        <p>探索</p>
      </div>
    </main>

    <footer>
      <a href="index.html"> 返回入口 </a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
